# Hypridle Configuration - Aurora Theme
# Cascade énergétique à 4 paliers : Dim -> Lock -> DPMS Off -> Suspend
# Extinction d'écran et veille désactivées si session verrouillée : pas d'écran noir ni veille PC sous verrou

general {
    lock_cmd = $HOME/.config/hypr/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# Palier 1 (150s / 2m30) : Baisse préventive de luminosité (désactivée si session verrouillée)
listener {
    timeout = 150
    on-timeout = [ ! -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/aurora/hypr_locked" ] && ! pgrep -x hyprlock >/dev/null && sh -c 'if command -v brightnessctl >/dev/null 2>&1 && [ -n "$(ls -A /sys/class/backlight 2>/dev/null)" ]; then brightnessctl -s set 20%; fi'
    on-resume = sh -c 'if command -v brightnessctl >/dev/null 2>&1 && [ -n "$(ls -A /sys/class/backlight 2>/dev/null)" ]; then brightnessctl -r; fi'
}

# Palier 2 (300s / 5 min) : Verrouillage session sécurisé
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Palier 3 (330s / 5m30) : Extinction des dalles DPMS (désactivée si session verrouillée : pas d'écran noir ni veille PC sous verrou)
listener {
    timeout = 330
    on-timeout = [ ! -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/aurora/hypr_locked" ] && ! pgrep -x hyprlock >/dev/null && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Palier 4 (1800s / 30 min) : Mise en veille profonde (désactivée si session verrouillée : pas d'écran noir ni veille PC sous verrou)
listener {
    timeout = 1800
    on-timeout = [ ! -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/aurora/hypr_locked" ] && ! pgrep -x hyprlock >/dev/null && systemctl suspend
}
