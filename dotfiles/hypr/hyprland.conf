# Hyprland Configuration - Aurora Theme
# Adapted for Hyprland 0.56.2 on Ubuntu 24.04 LTS

# ----------------- MONITORS -----------------
monitor = DP-2, 1920x1080@60, 0x0, 1
monitor = DP-1, 1920x1080@60, 1920x0, 1
monitor = , preferred, auto, 1

# Workspaces écran principal (Gauche : DP-2)
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2

# Workspaces écran secondaire (Droite : DP-1)
workspace = 6, monitor:DP-1, default:true
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

# ----------------- DEFAULT APPS -----------------
$terminal = kitty
$fileManager = nautilus
$menu = /home/user/.config/hypr/scripts/wofi-toggle.sh

# ----------------- AUTOSTART -----------------
# Écran principal X11 / XWayland (jeux, steam, etc.)
exec-once = xrandr --output DP-2 --primary
# Aurora Wallpaper (fallback statique instantané)
exec-once = swaybg -i /home/user/.config/hypr/theme-summer/wallpaper.jpg
# Linux Wallpaper Engine (démarrage en arrière-plan / tray avec restauration automatique)
exec-once = linux-wallpaper-engine
# Taskbar & Dock
exec-once = waybar
exec-once = $HOME/.config/waybar/scripts/spotify-card.py daemon &
exec-once = hypridle
# Polkit Authentication Agent
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1 2>/dev/null || /usr/libexec/polkit-gnome-authentication-agent-1 2>/dev/null
# Dynamic workspace auto-compactor
exec-once = python3 $HOME/.config/hypr/scripts/workspace-autocompact.py &
# Environment sync
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ----------------- ENVIRONMENT -----------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = TERMINAL,kitty

# ----------------- INPUT (AZERTY) -----------------
input {
    kb_layout = fr
    kb_variant = latin9
    kb_model = pc105
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# ----------------- AURORA THEME STYLE -----------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # Aurora neon gradient borders (boucle continue sans couture)
    col.active_border = rgba(00F0FFFF) rgba(7AA2F7FF) rgba(9778D0FF) rgba(00F0FFFF) 45deg
    col.inactive_border = rgba(04404aaa)

    layout = dwindle
    allow_tearing = false
}

decoration {
    # Aurora smooth curved corners
    rounding = 17

    # Deep glassmorphism blur
    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 1
        render_power = 3
    }
}

# ----------------- AURORA THEME ANIMATIONS -----------------
animations {
    enabled = true

    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = md3_standard, 0.2, 0.0, 0, 1.0
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 3, overshot, popin 80%
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 50, linear, loop
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, md3_decel, slide
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    session_lock_xray = true
}

binds {
    scroll_event_delay = 0
    pass_mouse_when_bound = false
}

# ----------------- LAYER & WINDOW RULES -----------------
# Blur Taskbar & Start Menu
layerrule {
    name = waybar_blur
    blur = true
    ignore_alpha = 0.1
    match:namespace = waybar
}

layerrule {
    name = wofi_blur
    blur = true
    ignore_alpha = 0.1
    match:namespace = wofi
}

# Floating windows
windowrule = float 1, match:class steam
windowrule = float 1, match:class pavucontrol
windowrule = float 1, match:title ^(Open File)(.*)$
windowrule = float 1, match:title ^(Open Folder)(.*)$
windowrule = float 1, match:title ^(Save As)(.*)$
windowrule = float 1, match:class ^(spotify-card)$
windowrule = pin 1, match:class ^(spotify-card)$
windowrule = move 600 44, match:class ^(spotify-card)$
windowrule = border_size 0, match:class ^(spotify-card)$
windowrule = animation slide top, match:class ^(spotify-card)$

# ----------------- PLUGINS -----------------
plugin = /home/user/.config/hypr/plugins/Hyprspace.so
plugin = /home/user/.config/hypr/plugins/hyprglass.so

plugin {
    overview {
        centerAligned = true
        drawActiveWorkspace = true
        showNewWorkspace = true
        exitOnClick = true
        exitOnSwitch = true
        affectStrut = false
        overrideGaps = false
    }

    hyprglass {
        enabled = true
        default_theme = dark
        default_preset = clear
        tint_color = 0x8899aa22

        brightness = 0.9
        dark:brightness = 0.82
        light:adaptive_boost = 0.5

        layers {
            enabled = 1
            namespaces = waybar
            preset = clear
        }
    }
}

# ----------------- KEYBINDINGS -----------------
$mainMod = SUPER

# Audio & Media (Volume wheel, touches multimédia)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous


# Hyprspace Overview (Mission Control)
bind = $mainMod, TAB, overview:toggle

# Menu Démarrer (désactivé sur simple appui de SUPER, accessible via SUPER + R)
# bindr = SUPER, SUPER_L, exec, pkill wofi || wofi --show drun

# Applications
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, L, exec, /home/user/.config/hypr/lock.sh
bind = $mainMod, S, exec, /home/user/.config/hypr/scripts/power-menu.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, /home/user/.config/hypr/scripts/reload.sh
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces (AZERTY 1-10)
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft, workspace, 5
bind = $mainMod, minus, workspace, 6
bind = $mainMod, egrave, workspace, 7
bind = $mainMod, underscore, workspace, 8
bind = $mainMod, ccedilla, workspace, 9
bind = $mainMod, agrave, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9
bind = $mainMod SHIFT, agrave, movetoworkspace, 10

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod SHIFT, mouse_down, movetoworkspace, e+1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, e-1

# = Source for hyprviz
source = ./hyprviz.conf