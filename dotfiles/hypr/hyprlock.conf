# Hyprlock Configuration - Aurora Theme

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    animation = inputFieldFade, 1, 3, md3_decel
    animation = inputFieldWidth, 1, 3.5, overshot
    animation = inputFieldColors, 1, 3, md3_decel
}

# Fond translucide pour afficher Wallpaper Engine / fond d'écran animé en direct
background {
    monitor =
    path =
    color = rgba(9, 7, 39, 0.40)
    blur_passes = 0
}

# HEURE (centrée)
label {
    monitor =
    text = $TIME
    color = rgb(91, 195, 233)
    font_size = 96
    font_family = Noto Sans Bold
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# DATE (juste sous l'heure)
label {
    monitor =
    text = cmd[update:43200000] date +"%A %d %B %Y"
    color = rgb(174, 196, 233)
    font_size = 22
    font_family = Noto Sans
    position = 0, -30
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# CHAMP MOT DE PASSE (sous la date, apparaît avec animation lors de la saisie)
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true

    # Couleurs Aurora Theme
    inner_color = rgba(9, 7, 39, 0.80)
    outer_color = rgba(00F0FFFF) rgba(7AA2F7FF) rgba(9778D0FF) 45deg
    font_color = rgb(225, 228, 241)
    
    check_color = rgba(122, 162, 247, 0.9)
    fail_color = rgba(247, 118, 142, 0.9)

    fade_on_empty = true
    fade_timeout = 2000
    rounding = 17
    font_family = Noto Sans

    placeholder_text = <span foreground="##7aa2f7">Mot de passe...</span>
    fail_text = <i>Échec de déverrouillage ($ATTEMPTS)</i>

    position = 0, -115
    halign = center
    valign = center
}
